# Build APK (manual: Actions → Build APK → Run workflow, pick the branch): the signed release build
# to install on the phone, plus R8's mapping.txt. Logic in the kit; here only this project's values.
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: Marcogn/claude-skill-android-kit/.github/workflows/build-apk.yml@v1
    with:
      app-module: app
      java-version: '17'
    secrets:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      # Extra build environment, if needed: BUILD_ENV: "API_CLIENT_ID=${{ secrets.API_CLIENT_ID }}"
